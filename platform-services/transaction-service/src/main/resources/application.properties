spring.application.name=transaction-service
server.port=8082

# HTTP client timeouts
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ============================================================
# Oracle datasource
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/ddl
spring.flyway.table=transaction_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ============================================================
# Downstream services
# ============================================================

services.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# ============================================================
# Transaction reconciliation
# ============================================================

transaction.reconciliation.enabled=true
transaction.reconciliation.fixed-delay-ms=60000
transaction.reconciliation.initial-delay-ms=30000
transaction.reconciliation.minimum-age-seconds=30
transaction.reconciliation.batch-size=50
transaction.reconciliation.max-attempts=5

# ============================================================
# Logging
# ============================================================

logging.pattern.correlation=[correlationId=%X{correlationId:-none}]

# ============================================================
# Account Service circuit breaker
# ============================================================

resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
resilience4j.circuitbreaker.instances.accountService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.automatic-transition-from-open-to-half-open-enabled=true

# Only dependency failures count as circuit-breaker failures
resilience4j.circuitbreaker.instances.accountService.record-exceptions=com.financialplatform.transaction.exception.AccountServiceUnavailableException
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=com.financialplatform.transaction.exception.TransactionBusinessException

# ============================================================
# Account Service retry
# ============================================================

resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=500ms
resilience4j.retry.instances.accountService.enable-exponential-backoff=true
resilience4j.retry.instances.accountService.exponential-backoff-multiplier=2

# Retry only temporary dependency failures
resilience4j.retry.instances.accountService.retry-exceptions=com.financialplatform.transaction.exception.AccountServiceUnavailableException
resilience4j.retry.instances.accountService.ignore-exceptions=com.financialplatform.transaction.exception.TransactionBusinessException